name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'zenda-cicd-demo/k8s/**'
      - 'zenda-cicd-demo/README.md'
      - 'zenda-cicd-demo/screenshots/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: zenda-demo
  APP_DIR: zenda-cicd-demo

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zenda-cicd-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: zenda-cicd-demo/pom.xml
      - name: Build and test
        run: mvn -B verify

  docker-push:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./zenda-cicd-demo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag in k8s manifest (GitOps)
        run: |
          sed -i "s|image: .*/${IMAGE_NAME}:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${{ github.sha }}|" ${APP_DIR}/k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${APP_DIR}/k8s/deployment.yaml
          git commit -m "ci: deploy image ${{ github.sha }} [skip ci]" || echo "No changes"
          git push
