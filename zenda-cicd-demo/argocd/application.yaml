apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zenda-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/atchutac/zenda-cicd-demo.git
    targetRevision: main
    path: zenda-cicd-demo/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
