apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenda-demo
  labels:
    app: zenda-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenda-demo
  template:
    metadata:
      labels:
        app: zenda-demo
    spec:
      containers:
        - name: zenda-demo
          image: purnalti123/zenda-demo:c1eebad604fc35218f7bfca0e3282d2e0a2141f6
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
